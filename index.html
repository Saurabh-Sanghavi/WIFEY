<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello Baacha ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#FDECEF;
font-family:Arial, sans-serif;
height:100vh;
}

/* Sliding Doors */

.door{
position:fixed;
top:0;
width:50%;
height:100%;
background:#F8C8DC;
z-index:10;
transition:2.2s ease-in-out;
}

.left{
left:0;
border-right:2px solid rgba(255,255,255,.35);
}

.right{
right:0;
border-left:2px solid rgba(255,255,255,.35);
}

body.open .left{
transform:translateX(-100%);
}

body.open .right{
transform:translateX(100%);
}

/* Main */

.container{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
transform:scale(.9);
transition:1.5s;
}

body.open .container{
opacity:1;
transform:scale(1);
}

h1{

font-family:'Great Vibes',cursive;
font-size:92px;
font-weight:normal;
color:#d63384;
text-shadow:
0 0 10px rgba(255,255,255,.9),
0 0 30px rgba(255,182,193,.7);

animation:float 3s ease-in-out infinite;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

.small{
margin-top:18px;
font-size:20px;
color:#b05c82;
letter-spacing:3px;
opacity:.8;
font-family:Georgia, serif;
}

</style>

</head>
<body>

<div class="door left"></div>
<div class="door right"></div>

<div class="container">

<h1>Hello Baacha ❤️</h1>

<div class="small">
It's 16 July Today
</div>

</div>

<script>

setTimeout(()=>{

document.body.classList.add("open");

},800);

</script>

</body>
</html>
