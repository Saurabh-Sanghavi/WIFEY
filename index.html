<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Baacha ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#FDECEF;
overflow:hidden;
font-family:Arial,sans-serif;
}

/* ---------- PAGE ---------- */

.page{
width:100vw;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
position:absolute;
top:0;
left:0;
transition:1s;
}

#page2{
display:none;
padding:60px;
}

/* ---------- DOORS ---------- */

.door{
position:fixed;
top:0;
width:50%;
height:100%;
background:#F8C8DC;
z-index:100;
transition:2s;
}

.left{
left:0;
border-right:2px solid white;
}

.right{
right:0;
border-left:2px solid white;
}

.open .left{
transform:translateX(-100%);
}

.open .right{
transform:translateX(100%);
}

/* ---------- PAGE 1 ---------- */

h1{
font-family:'Great Vibes',cursive;
font-size:90px;
color:#d63384;
text-align:center;
animation:float 3s infinite;
}

.subtitle{
margin-top:15px;
font-size:22px;
color:#b15d82;
letter-spacing:2px;
}

.next{
margin-top:80px;
padding:16px 45px;
font-size:22px;
border:none;
border-radius:50px;
background:#ff69b4;
color:white;
cursor:pointer;
transition:.3s;
}

.next:hover{
background:#ff4d9a;
transform:scale(1.08);
}

/* ---------- PAGE 2 ---------- */

.container{

display:flex;
justify-content:space-between;
align-items:flex-start;
width:100%;

}

.leftSide{
width:45%;
}

.leftSide h2{

font-family:'Great Vibes',cursive;
font-size:80px;
color:#d63384;
line-height:1.2;

}

.rightSide{
width:35%;
}

.brush{

background:#ffb6c1;
margin-bottom:18px;
padding:18px;
font-size:28px;
font-weight:bold;
text-align:center;
color:white;
border-radius:40px;
box-shadow:0 8px 20px rgba(0,0,0,.15);

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}

}

</style>

</head>

<body>

<div class="door left"></div>
<div class="door right"></div>

<div id="page1" class="page">

<h1>Hello Baacha ❤️</h1>

<div class="subtitle">
Welcome to our little world
</div>

<button class="next" onclick="nextPage()">
Next ❤️
</button>

</div>

<div id="page2" class="page">

<div class="container">

<div class="leftSide">

<h2>

Happy<br>
6-Month<br>
Anniversary ❤️

</h2>

</div>

<div class="rightSide">

<div class="brush">Half Year</div>

<div class="brush">6 Months</div>

  <div class="brush">183 Days</div>

<div class="brush">26 Weeks</div>

<div class="brush">4380 Hours</div>

</div>

</div>

</div>

<script>

setTimeout(function(){

document.body.classList.add("open");

},800);

function nextPage(){

document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="flex";

document.body.style.overflow="auto";

}

</script>

</body>

</html>
