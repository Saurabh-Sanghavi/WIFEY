<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open My Heart ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#FDECEF;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:Poppins,sans-serif;

}

.container{

text-align:center;

}

h2{

font-family:'Great Vibes',cursive;
font-size:60px;
color:#d63384;
margin-bottom:40px;

}

.envelope{

position:relative;
width:320px;
height:220px;
margin:auto;
cursor:pointer;
animation:float 3s ease-in-out infinite;

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}

}

.back{

position:absolute;
width:100%;
height:100%;
background:#f6b6c8;
border-radius:8px;
overflow:hidden;

}

.flap{

position:absolute;
top:0;
left:0;
width:100%;
height:110px;
background:#f3a8bd;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1s;

}

.leftFold{

position:absolute;
bottom:0;
left:0;
width:50%;
height:100%;
background:#f8bfd0;
clip-path:polygon(0 0,100% 100%,0 100%);

}

.rightFold{

position:absolute;
bottom:0;
right:0;
width:50%;
height:100%;
background:#f8bfd0;
clip-path:polygon(100% 0,100% 100%,0 100%);

}

.letter{

position:absolute;
left:10%;
bottom:15px;
width:80%;
height:170px;
background:white;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
display:flex;
justify-content:center;
align-items:center;
font-family:'Great Vibes',cursive;
font-size:38px;
color:#d63384;
transition:1.2s;

}

.seal{

position:absolute;
left:50%;
top:75px;
transform:translateX(-50%);
width:60px;
height:60px;
background:#ff4f8b;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:24px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
z-index:5;

}

.open .flap{

transform:rotateX(180deg);

}

.open .letter{

transform:translateY(-180px);

}

#message{

display:none;
max-width:700px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 15px 30px rgba(0,0,0,.15);
margin-top:50px;
line-height:1.8;
font-size:20px;
color:#5d4053;

}

.next{

display:none;
margin-top:25px;
padding:15px 35px;
border:none;
background:#ff69b4;
color:white;
border-radius:40px;
font-size:20px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h2>Open My Heart ❤️</h2>

<div class="envelope" onclick="openLetter()">

<div class="back"></div>

<div class="letter">
For My Baacha ❤️
</div>

<div class="leftFold"></div>

<div class="rightFold"></div>

<div class="flap"></div>

<div class="seal">
❤
</div>

</div>

<div id="message">

<div id="typing"></div>

<button class="next">
Continue ❤️
</button>

</div>
<script>

const text=`Happy 6 Months, My Baacha ❤️

Six months ago you entered my life and unknowingly became the most beautiful part of it.

Thank you for every smile, every laugh, every late-night call and every memory we've created together.

No matter where life takes us, I promise to keep choosing you again and again.

Happy 6-Month Anniversary, My Love.

I Love You Forever ❤️`;

let i=0;

function openLetter(){

document.querySelector(".envelope").classList.add("open");

setTimeout(function(){

document.getElementById("message").style.display="block";

typeWriter();

createHearts();

},1200);

}

function typeWriter(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(typeWriter,35);

}else{

document.querySelector(".next").style.display="inline-block";

}

}

function createHearts(){

for(let i=0;i<30;i++){

let heart=document.createElement("div");

heart.innerHTML="❤️";

heart.style.position="fixed";
heart.style.left=Math.random()*100+"vw";
heart.style.top="100vh";
heart.style.fontSize=(18+Math.random()*18)+"px";
heart.style.pointerEvents="none";
heart.style.transition="4s linear";

document.body.appendChild(heart);

setTimeout(function(){

heart.style.transform="translateY(-120vh)";
heart.style.opacity="0";

},50);

setTimeout(function(){

heart.remove();

},4000);

}

}

</script>

</body>
</html>
